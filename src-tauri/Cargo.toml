[package]
name = "harbor"
version = "0.1.0"
description = "Local-first REST API development studio"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
